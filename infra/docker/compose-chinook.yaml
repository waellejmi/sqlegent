services:
  postgres:
    image: postgres:16-alpine
    container_name: chinook-postgres
    environment:
      POSTGRES_USER: chinook_user
      POSTGRES_PASSWORD: ChinookPass123!
      POSTGRES_DB: chinook
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinook_user -d chinook"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../data/Chinook_PostgreSql.sql:/docker-entrypoint-initdb.d/chinookpg.sql:ro

  mysql:
    image: mysql:8.0
    container_name: chinook-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ChinookPass123!
      MYSQL_USER: chinook_user
      MYSQL_PASSWORD: ChinookPass123!
      MYSQL_DATABASE: chinook
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "chinook_user", "-pChinookPass123!"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ../../data/Chinook_MySql.sql:/docker-entrypoint-initdb.d/chinookmysql.sql:ro
  mariadb:
    image: mariadb:lts
    container_name: chinook-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ChinookPass123!
      MARIADB_USER: chinook_user
      MARIADB_PASSWORD: ChinookPass123!
      MARIADB_DATABASE: chinook
    ports:
      - "${MYSQL_PORT:-3310}:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "chinook_user", "-pChinookPass123!"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ../../data/Chinook_MySql.sql:/docker-entrypoint-initdb.d/chinookmysql.sql:ro

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: chinook-oracle
    environment:
      ORACLE_PASSWORD: "ChinookPass123!"
      APP_USER: "chinook_user"
      APP_USER_PASSWORD: "ChinookPass123!"
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    tmpfs:
      - /var/lib/oracle
    volumes:
      - ../../data/Chinook_Oracle.sql:/docker-entrypoint-initdb.d/chinookoracle.sql:ro



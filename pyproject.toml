[project]
name = "sql-agent"
version = "0.1.0"
author = "wael.lejmi02@gmail.com"
description = "Agent to transform human messages to sql requests "
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.0.0",
    "httpx>=0.28.1",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.2",
    "langgraph>=1.0.8",
    "mcp[cli]>=1.26.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.2.1",
    "sqlglot>=29.0.1",
]

[dependency-groups]
dev = []



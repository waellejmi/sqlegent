models:
  - name: Artist
    description: Musical artist or band entity used for attribution in sales analytics.
    aliases:
      - artists
      - musician
      - band
    columns:
      - name: ArtistId
        description: Primary key of the artist.
      - name: Name
        description: Display name of the artist.
  - name: Album
    description: Album released by one artist.
    aliases:
      - record
      - release
    columns:
      - name: AlbumId
        description: Primary key of the album.
      - name: ArtistId
        description: Foreign key to Artist.ArtistId.
      - name: Title
        description: Album title.
  - name: Track
    description: Sellable track that belongs to an album.
    aliases:
      - song
      - track
      - title
    columns:
      - name: TrackId
        description: Primary key of the track.
      - name: AlbumId
        description: Foreign key to Album.AlbumId.
      - name: UnitPrice
        description: List price of a track (not final line amount for analytics).
  - name: InvoiceLine
    description: Line-level sales facts; safest source for item quantity and line revenue.
    aliases:
      - sales lines
      - order lines
      - line items
    columns:
      - name: InvoiceLineId
        description: Primary key of invoice line.
      - name: InvoiceId
        description: Foreign key to Invoice.InvoiceId.
      - name: TrackId
        description: Foreign key to Track.TrackId.
      - name: UnitPrice
        description: Sold unit price at invoice line level.
      - name: Quantity
        description: Number of units sold for this track line.
  - name: artist
    description: Represents the artist of the track
    aliases:
      - singer
      - rapper
instructions:
  - id: artist_revenue_top5
    scope: sql
    question: top 5 artists by revenue total revenue tracks sold units sold
    instruction: >
      For artist revenue questions, use Artist -> Album -> Track -> InvoiceLine
      joins.

      Compute total_revenue as SUM(InvoiceLine.UnitPrice *
      InvoiceLine.Quantity).

      Compute tracks_sold as SUM(InvoiceLine.Quantity).

      Group by Artist.ArtistId and Artist.Name.

      Order by total_revenue DESC, tracks_sold DESC, Artist.Name ASC.

      Apply LIMIT 5 unless the user asks for a different count.

      Do not use Invoice.Total for artist-level attribution.
  - id: customer_spend_above_average
    scope: sql
    question: customers above average total spending
    instruction: >
      For customer spending, aggregate Invoice.Total by customer, then compare
      each customer total against the average of per-customer totals (not
      average invoice amount).
  - id: top_bought_tracks
    scope: sql
    question: most bought tracks of all times
    instruction: >
      For most bought tracks,look at the list of all purchased items (invoice
      lines), since each one represents a song bought by a customer.

      For each entry, identify the track and add up how many times it was
      purchased, combining all occurrences of the same song into a single total.

      Once you’ve summed the purchases for every track, arrange them from
      highest to lowest.

      The tracks at the top of this list are the most bought of all time.

      Also List MediaType and Genre for each track.
  - id: country_agent_segmentation_rule
    scope: sql
    question: country agent revenue segmentation customer filtering
    instruction: >
      When building any country-based aggregation involving sales agents:

      1. Always attribute country to the Customer entity (Customer.Country).
        Never use Employee or Agent country for grouping or filtering unless explicitly requested.

      2. The join path for revenue must be:
        Customer → Invoice → InvoiceLine → Track
        and then linked back to Employee via Customer.SupportRepId.

      3. Country grouping is determined at the Customer level before any
      aggregation.

      4. Any agent-level metrics (revenue, counts, rankings) must be computed
      after customers are assigned to agents.

      5. Do not assume agents operate within their own country. Agents can
      support customers globally.

      6. If both Customer.Country and Employee.Country exist in the schema,
      always prefer Customer.Country unless the question explicitly states
      otherwise.

      7. Apply all customer-level filters before joining to Employee to avoid
      inflating or duplicating metrics.
  - id: operational_revenue_attribution
    scope: sql
    question: total revenue sales operations country geography
    instruction: |2-
          When users query revenue or sales performance by a specific country 
          or geographic region, always interpret this as the location of the 
          internal corporate sales team (Employee.Country). Route the transaction 
          history back to the employee via the join path: 
          Invoice -> Customer -> Employee (SupportRepId). Do not filter by 
          Invoice.BillingCountry unless client market distribution is explicitly requested.

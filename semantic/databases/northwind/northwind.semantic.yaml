models: []
instructions:
  - id: financial_revenue_recognition_rule
    scope: sql
    question: total revenue sales generated country geography
    instruction: |-
      When calculating realized revenue or sales performance:
          1. Only include finalized transactions where the order has physically 
             shipped. Always filter out unfulfilled or pending orders using 
             the constraint: Orders.ShippedDate IS NOT NULL.
          2. Attribute geography using the customer's billing country (Customers.Country).

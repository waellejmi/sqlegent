{% extends "base.html" %}
{% block content %}
<h1>Import Relationships</h1>
<p>Paste relationship document (JSON/YAML/plain text for now).</p>

<form id="importForm" class="form-grid">
  <label>
    Name
    <input id="name" name="name" type="text" required>
  </label>

  <label>
    Content
    <textarea id="content" name="content" rows="12" required></textarea>
  </label>

  <button type="submit">Import</button>
</form>

<pre id="importResult" class="panel"></pre>

<script>
  const form = document.getElementById("importForm");
  const output = document.getElementById("importResult");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const payload = {
      name: document.getElementById("name").value,
      content: document.getElementById("content").value,
    };
    const res = await fetch("/api/relationships/import", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    output.textContent = JSON.stringify(data, null, 2);
  });
</script>
{% endblock %}
